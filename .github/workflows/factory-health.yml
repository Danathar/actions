name: Factory Health

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  issues: write

concurrency:
  group: factory-health
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Generate common issue token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}
          owner: projectbluefin
          repositories: common
          permission-issues: write

      - name: Monitor 24h factory success rates
        env:
          COMMON_ISSUE_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          WINDOW_HOURS=24
          THRESHOLD=80
          # Minimum completed runs inside the window before the rate is
          # trusted. A once-a-day pipeline (Nightly E2E) contributes one run
          # to a 24h window, where the only representable rates are 100% and
          # 0% — a single flake reads as a total outage and files a P0
          # (projectbluefin/actions#479, #555). Below the floor: "low-sample".
          MIN_RUNS=3
          # Escalation floor so the sample floor is not a blind spot: an
          # under-sampled pipeline still alerts once this many of its most
          # recent completed runs failed back-to-back.
          MIN_CONSECUTIVE_FAILURES=2
          CUTOFF_EPOCH=$(date -u -d "${WINDOW_HOURS} hours ago" '+%s')
          # Same instant as CUTOFF_EPOCH, in the form `gh run list --created`
          # accepts, so the fetch is bounded by the window the rate is computed
          # over instead of by an arbitrary run count. Both are derived from
          # WINDOW_HOURS so they cannot drift apart.
          CUTOFF_ISO=$(date -u -d "@${CUTOFF_EPOCH}" '+%Y-%m-%dT%H:%M:%SZ')
          RUN_FETCH_LIMIT=200

          if [[ -n "${COMMON_ISSUE_TOKEN}" ]]; then
            ISSUE_REPO="projectbluefin/common"
            ISSUE_TOKEN="${COMMON_ISSUE_TOKEN}"
          else
            ISSUE_REPO="${GITHUB_REPOSITORY}"
            ISSUE_TOKEN="${GH_TOKEN}"
            echo "::warning::The common issue token is unavailable; factory alerts will be filed in ${ISSUE_REPO}."
          fi

          monitor_pipeline() {
            local repo="$1"
            local pipeline="$2"
            local workflow="$3"

            local runs_json fetched recent_json completed_json total success rate_display rate_value status failures_md
            local consecutive_failures

            # `--created` filters server-side, so the fetch budget is spent on
            # runs inside the window instead of on history that the cutoff
            # filter below discards anyway. Without it the 24h sample is
            # defended only by low run volume: a busy pipeline's most recent
            # N runs can all predate the window, silently shrinking the
            # measured set — worst case a healthy pipeline reads `no-runs`.
            runs_json=$(gh run list \
              --repo "${repo}" \
              --workflow "${workflow}" \
              --created ">=${CUTOFF_ISO}" \
              --limit "${RUN_FETCH_LIMIT}" \
              --json createdAt,status,conclusion,url \
              2>/dev/null || echo '[]')

            # Saturating the cap means the window may still be truncated.
            # Say so rather than reporting a rate computed from a partial
            # sample as if it were the whole window.
            fetched=$(jq 'length' <<<"${runs_json}")
            if (( fetched >= RUN_FETCH_LIMIT )); then
              echo "::warning::${repo} / ${workflow}: fetched ${fetched} runs, saturating the ${RUN_FETCH_LIMIT}-run cap for the ${WINDOW_HOURS}h window; the measured sample may be truncated. Raise RUN_FETCH_LIMIT in factory-health.yml." >&2
            fi

            # Kept even though --created already bounds the fetch: the server
            # filter is a search qualifier, not a guarantee, and the rate must
            # be computed over exactly the window the alert claims.
            recent_json=$(jq --argjson cutoff "${CUTOFF_EPOCH}" '
              [ .[]
              | select((.createdAt | fromdateiso8601) >= $cutoff)
              ]
            ' <<<"${runs_json}")

            completed_json=$(jq '
              [ .[]
              # Only genuine build outcomes count toward the success rate.
              # Cancelled runs were preempted (not failed) and action_required
              # runs are pending approval — neither produced a build result, so
              # counting them deflates the rate and fires false alerts
              # (projectbluefin/actions#483). skipped/in_progress excluded too.
              | select(.status == "completed" and (.conclusion == "success" or .conclusion == "failure"))
              ]
            ' <<<"${recent_json}")

            total=$(jq 'length' <<<"${completed_json}")
            success=$(jq '[ .[] | select(.conclusion == "success") ] | length' <<<"${completed_json}")

            # Back-to-back failures on the most recent completed runs, read from
            # the whole fetched history rather than the window: a once-a-day
            # pipeline has one run in a 24h window, so the window alone cannot
            # tell a one-off flake from a pipeline failing every night.
            # index("success") is the count of leading failures; null (never
            # succeeded in the fetched history) falls back to the run count.
            consecutive_failures=$(jq '
              [ .[]
              | select(.status == "completed" and (.conclusion == "success" or .conclusion == "failure"))
              ]
              | sort_by(.createdAt)
              | reverse
              | map(.conclusion)
              | (index("success") // length)
            ' <<<"${runs_json}")

            if (( total > 0 )); then
              rate_value=$(( success * 100 / total ))
              rate_display="${rate_value}%"
              if (( rate_value >= THRESHOLD )); then
                status="healthy"
              elif (( total >= MIN_RUNS )); then
                status="alert"
              elif (( consecutive_failures >= MIN_CONSECUTIVE_FAILURES )); then
                # Under-sampled, but failing run after run — a real outage.
                status="alert"
              else
                status="low-sample"
              fi
            else
              rate_value=-1
              rate_display="n/a"
              status="no-runs"
            fi

            failures_md=$(jq -r '
              [
                .[]
                | select(.conclusion != "success")
                | "- [" + .conclusion + "](" + .url + ")"
              ][0:5][]
            ' <<<"${completed_json}" || true)

            jq -n \
              --arg repo "${repo}" \
              --arg pipeline "${pipeline}" \
              --arg workflow "${workflow}" \
              --argjson total "${total}" \
              --argjson success "${success}" \
              --argjson rate_value "${rate_value}" \
              --arg rate_display "${rate_display}" \
              --arg status "${status}" \
              --argjson consecutive_failures "${consecutive_failures}" \
              --arg failures_md "${failures_md}" \
              '{
                repo: $repo,
                pipeline: $pipeline,
                workflow: $workflow,
                total: $total,
                success: $success,
                rate_value: $rate_value,
                rate_display: $rate_display,
                status: $status,
                consecutive_failures: $consecutive_failures,
                failures_md: $failures_md
              }'
          }

          results='[]'
          while IFS='|' read -r repo pipeline workflow; do
            row=$(monitor_pipeline "${repo}" "${pipeline}" "${workflow}")
            results=$(jq --argjson row "${row}" '. + [$row]' <<<"${results}")
          done <<'EOF'
          projectbluefin/bluefin|Build|Testing Images
          projectbluefin/bluefin|E2E|Nightly E2E
          projectbluefin/bluefin|Promote|Promote testing to main
          projectbluefin/bluefin-lts|Build|Build Bluefin LTS
          projectbluefin/bluefin-lts|E2E|Post-Merge E2E — Testing Parity
          projectbluefin/bluefin-lts|Promote|Promote testing to main
          projectbluefin/dakota|Build|Build Bluefin dakota
          projectbluefin/dakota|Promote|Publish Bluefin dakota
          projectbluefin/common|Build|Build
          projectbluefin/common|Unit Tests|Unit Tests
          EOF

          summary_table=$(
            jq -r '
              [
                "| Repo | Pipeline | Workflow | Success | Rate | Status |",
                "|---|---|---|---:|---:|---|"
              ] + (
                map(
                  "| \(.repo) | \(.pipeline) | \(.workflow) | \(.success)/\(.total) | \(.rate_display) | \(.status) |"
                )
              ) | .[]
            ' <<<"${results}"
          )

          echo "Factory health summary (${WINDOW_HOURS}h window)"
          echo "${summary_table}"
          {
            echo "## Factory health summary (${WINDOW_HOURS}h window)"
            echo
            echo "${summary_table}"
          } >> "${GITHUB_STEP_SUMMARY}"

          open_issues_json=$(GH_TOKEN="${ISSUE_TOKEN}" gh issue list \
            --repo "${ISSUE_REPO}" \
            --state open \
            --limit 100 \
            --json number,title,url)

          existing_labels=$(GH_TOKEN="${ISSUE_TOKEN}" gh label list \
            --repo "${ISSUE_REPO}" \
            --limit 200 \
            --json name \
            --jq '.[].name')

          label_args=()
          for label in priority/p0 area/ci kind/bug; do
            if grep -Fxq "${label}" <<<"${existing_labels}"; then
              label_args+=(--label "${label}")
            else
              echo "::warning::Label '${label}' does not exist in ${ISSUE_REPO}; skipping it."
            fi
          done

          issues_opened=0
          while IFS= read -r breach; do
            repo=$(jq -r '.repo' <<<"${breach}")
            pipeline=$(jq -r '.pipeline' <<<"${breach}")
            workflow=$(jq -r '.workflow' <<<"${breach}")
            rate_display=$(jq -r '.rate_display' <<<"${breach}")
            success=$(jq -r '.success' <<<"${breach}")
            total=$(jq -r '.total' <<<"${breach}")
            consecutive_failures=$(jq -r '.consecutive_failures' <<<"${breach}")
            failures_md=$(jq -r '.failures_md' <<<"${breach}")

            title_prefix="fix(factory): [${repo}] [${pipeline}] success rate dropped"
            existing_issue=$(jq -r \
              --arg prefix "${title_prefix}" \
              '.[] | select(.title | startswith($prefix)) | .number' \
              <<<"${open_issues_json}" | head -1)

            if [[ -n "${existing_issue}" ]]; then
              echo "Open issue already exists for ${repo} ${pipeline}: #${existing_issue}"
              continue
            fi

            if [[ -z "${failures_md}" ]]; then
              failures_md='- No failing completed runs captured in the 24h window.'
            fi

            issue_title="${title_prefix} to ${rate_display} (24h window)"
            issue_body=$(cat <<EOF
          ## Factory success rate alert

          Monitoring window: last ${WINDOW_HOURS} hours
          Threshold: ${THRESHOLD}%
          Minimum sample for a rate alert: ${MIN_RUNS} completed runs
          (below that, ${MIN_CONSECUTIVE_FAILURES} back-to-back failures)

          ### Current pipeline rates
          ${summary_table}

          ### Alerting pipeline
          - Repo: ${repo}
          - Pipeline: ${pipeline}
          - Workflow: ${workflow}
          - Success rate: ${rate_display} (${success}/${total})
          - Consecutive failures on the most recent completed runs: ${consecutive_failures}

          ### Failing runs
          ${failures_md}

          Opened automatically by \`.github/workflows/factory-health.yml\`.
          EOF
            )

            GH_TOKEN="${ISSUE_TOKEN}" gh issue create \
              --repo "${ISSUE_REPO}" \
              --title "${issue_title}" \
              --body "${issue_body}" \
              "${label_args[@]}"

            issues_opened=$((issues_opened + 1))
          done < <(jq -c '.[] | select(.status == "alert")' <<<"${results}")

          low_sample=$(jq -r '[ .[] | select(.status == "low-sample") ] | length' <<<"${results}")
          if (( low_sample > 0 )); then
            echo "::notice::${low_sample} pipeline(s) are below the ${MIN_RUNS}-run sample floor; reported as low-sample instead of alert."
          fi

          echo "Opened ${issues_opened} issue(s)."
